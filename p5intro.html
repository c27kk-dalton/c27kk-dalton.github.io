<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>




</head>
<body>
<script>
	function setup() {
		createCanvas(2000, 2000);
	}

function draw() {
	background(200)
	for(let i=0; i<11; i++){
		for(let j = 0; j < 11; j++) {
			let x = i * 100
			let y = j * 100
		circle(x ,y, 100)
		circle(x-30, y-50, 30)
		circle(x+30, y-50, 30)
		arc(x,y, 50, 50, 0, PI)
		}
	}
}
</script>
</body>
</html>
