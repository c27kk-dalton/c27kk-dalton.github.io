<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>
</head>
<body>
<script>
	let xpos
	let ypos
	let xspeed = 5
	let yspeed = 8
	let fillColor = "blue"
	function setup() {
		createCanvas(800,800)
		xpos = width/2
		ypos = height/2
	}

    function draw() {
    	background(200)
    	 if (xpos + 25 > width || xpos - 25 < 0) {
        	xspeed *= -1
        }
        if (ypos + 25 > height || ypos - 25 < 0){
        	yspeed *= -1
        }
        if (xpos > width/2 && ypos < height/2) {
        	fillColor = "green"
        } else if (xpos > width/2 && ypos > height/2) {
        	fillColor = "blue"
        } else if (xpos < width/2 && ypos < height/2) {
        	fillColor = "burlywood"
        } else {
        	fillColor = "pink"
        }



        

    	xpos += xspeed
    	ypos += yspeed
    	fill(fillColor)
    	circle(xpos, ypos, 50)
    }


</script>



</body>
</html>
