<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>

<style>
	.container{
		display: grid;
		grid-template-columns: repeat(4, 1fr);
	}

	.item{
		border: 1px solid black;
	}
	.item img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}
	#fav{
		grid-column: 2 / 4;
		grid-row: 1 / 3;
	}
	@media (max-width: 800px){
		.container {
			grid-template-columns: repeat(1, 1fr);
		}
	}
</style>


</head>
<body>
<div class="container">
	<div class="item" id="fav">
		<img src="bam.jpeg" alt="Bam Adebayo">
	</div>
	<div class="item">
		<img src="ant.jpeg" alt="Anthony Edwards">
	</div>
	<div class="item">
		<img src="bones.jpeg" alt="Bones Hyland">
	</div>
	<div class="item">
		<img src="brunson.jpeg" alt="Jalen Brunson">
	</div>
	<div class="item">
		<img src="faiz.jpeg" alt="Faiz Rashid">
	</div>





</body>
</html>
